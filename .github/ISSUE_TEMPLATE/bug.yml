name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Pocket XR version
      description: Menu, then Pocket XR Settings.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Galaxy Z Flip 7, Android 16
    validations:
      required: true
  - type: input
    id: glasses
    attributes:
      label: Glasses
      placeholder: XREAL One
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "Optional but very helpful: adb logcat -d -v time -s 'FlipSpaces/*' 'FlipSpacesHands'"
      render: text

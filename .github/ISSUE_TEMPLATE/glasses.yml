name: Glasses report
description: How Pocket XR works on your glasses (especially models in community testing).
labels: ["device report"]
body:
  - type: textarea
    id: report
    attributes:
      label: Glasses report
      description: In the app, Menu, then Pocket XR Settings, then Advanced, then Glasses report, then share or paste it here.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: What works
      options:
        - label: The Space opens on the glasses
        - label: Head tracking keeps windows in place (looking left, right, up and down)
        - label: 3D side by side turns on and stays on
        - label: The windows are the right size for the glasses' view
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What looked wrong, and any setting on the glasses you changed.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One PR for all Gradle updates, instead of one per library.
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One PR for all GitHub Actions updates.
    groups:
      github-actions:
        patterns: ["*"]

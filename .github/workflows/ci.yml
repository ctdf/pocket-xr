name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clean source check
        run: bash tools/check-clean.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Only platform-tools: the action's default also asks for the retired "tools" package, which today's sdkmanager no
      # longer has (the first run failed there).
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      # Keep this the same as distributionUrl in gradle/wrapper/gradle-wrapper.properties. AGP 9.5 needs Gradle 9.6 or
      # later, so CI on 9.5.1 failed Dependabot's AGP and wrapper update.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: Unit tests
        run: gradle :core:test --no-daemon
      - name: Build the app
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/
